<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="avatarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#162238" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="starkRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="200" fill="url(#avatarBg)" />

  <!-- Outer Tech Rings -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.6" stroke-dasharray="15 10" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#starkRed)" stroke-width="1.5" opacity="0.4" stroke-dasharray="30 15" />
  <circle cx="200" cy="200" r="150" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.2" />

  <!-- Sci-Fi HUD Crosshairs -->
  <line x1="20" y1="200" x2="60" y2="200" stroke="#00f0ff" stroke-width="2" />
  <line x1="340" y1="200" x2="380" y2="200" stroke="#00f0ff" stroke-width="2" />
  <line x1="200" y1="20" x2="200" y2="60" stroke="#00f0ff" stroke-width="2" />
  <line x1="200" y1="340" x2="200" y2="380" stroke="#00f0ff" stroke-width="2" />

  <!-- Developer Silhouette Silhouette & Stark HUD Glasses/Visor -->
  <!-- Shoulders -->
  <path d="M 100,340 Q 200,280 300,340 Z" fill="#0d1829" stroke="url(#neonCyan)" stroke-width="2" filter="url(#glowEffect)" />

  <!-- Neck -->
  <rect x="180" y="240" width="40" height="50" rx="10" fill="#111c30" stroke="#00f0ff" stroke-width="1" />

  <!-- Head Outline -->
  <ellipse cx="200" cy="180" rx="65" ry="80" fill="#15243b" stroke="url(#starkRed)" stroke-width="2" filter="url(#glowEffect)" />

  <!-- Cyber Visor / Glasses (Marvel Stark Tech) -->
  <path d="M 150,165 Q 200,155 250,165 L 245,190 Q 200,205 155,190 Z" fill="#00f0ff" opacity="0.85" filter="url(#glowEffect)" />
  <line x1="145" y1="175" x2="255" y2="175" stroke="#ffffff" stroke-width="2" opacity="0.9" />

  <!-- Arc Reactor Chest Node -->
  <circle cx="200" cy="315" r="16" fill="#00f0ff" filter="url(#glowEffect)" />
  <circle cx="200" cy="315" r="8" fill="#ffffff" />
  <polygon points="200,303 210,320 190,320" fill="none" stroke="#ff0055" stroke-width="1.5" />

  <!-- Holographic Code Floating Text -->
  <text x="200" y="75" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="12" letter-spacing="4" opacity="0.8">SATYAM MAURYA // AI ARCHITECT</text>
</svg>
