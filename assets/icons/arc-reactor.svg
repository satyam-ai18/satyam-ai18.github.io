<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="reactorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ffb700" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#reactorGlow)" stroke-width="2" opacity="0.6" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6, 3" />
  <circle cx="50" cy="50" r="28" fill="none" stroke="#ff0055" stroke-width="2" filter="url(#glow)" />
  <!-- Tri-arc elements -->
  <polygon points="50,26 68,60 32,60" fill="none" stroke="#00f0ff" stroke-width="2" />
  <circle cx="50" cy="50" r="12" fill="#00f0ff" opacity="0.8" filter="url(#glow)" />
  <circle cx="50" cy="50" r="6" fill="#ffffff" />
</svg>
